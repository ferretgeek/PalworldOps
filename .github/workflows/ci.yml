name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m py_compile palworldctl.py palworld-panel.py
      - name: Check browser JavaScript
        run: node --check panel/panel.js
      - name: Check shell scripts
        run: bash -n backup-after-stop.sh
      - name: Reject private deployment residue
        shell: pwsh
        run: |
          $patterns = 'C:\\Users\\|SaveGames/0/[A-Fa-f0-9]{32}/|(?:10\.(?:\d{1,3}\.){2}\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.(?:\d{1,3}\.)\d{1,3}|192\.168\.(?:\d{1,3}\.)\d{1,3})'
          $hits = rg -n --hidden --glob '!.git/**' --pcre2 $patterns .
          if ($LASTEXITCODE -eq 0) { $hits; throw 'Private deployment residue found.' }
          if ($LASTEXITCODE -ne 1) { throw 'Privacy scan failed.' }
